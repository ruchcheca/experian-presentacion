<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de financiación · Belender</title><style>
/* ============================================================
   Belender · Presentación interactiva — estilos compartidos
   Pensado para proyección en pantalla: tipografía grande (Tahoma),
   sin scroll vertical, navegación por secciones tipo galería.
   ============================================================ */

:root {
  --green: #86ae6b;
  --green-600: #5e8f4a;
  --green-300: #9cc77d;
  --green-200: #bcd9a5;
  --green-150: #cfe6bb;
  --green-100: #d4e3c4;
  --green-tint: #eef4e7;
  --grad: linear-gradient(135deg, var(--green-600), var(--green-300));
  --ink: #0B1120;
  --ink-2: #1f2a17;
  --slate: #5A6478;
  --slate-2: #3A4358;
  --slate-3: #26304A;
  --muted: #8A93A6;
  --muted-d: #9AA9C4;
  --bg: #ffffff;
  --bg-alt: #F6F8FC;
  --line: #E6E9F0;
  --line-2: #EEF1F7;
  --line-3: #E3E7F0;
  --font: Tahoma, Verdana, Segoe UI, system-ui, sans-serif;
  --font-head: var(--font);
  --font-body: var(--font);
  --fs-base: 25px;
  --radius: 22px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden; /* no scroll: todo cabe en pantalla, como una diapositiva */
}

body {
  font-family: var(--font);
  font-size: var(--fs-base);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}

img, svg { display: block; max-width: 100%; }
button { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ============================================================
   Barra superior (todas las páginas salvo el índice)
   ============================================================ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  height: 84px; display: flex; align-items: center; gap: 24px;
  padding: 0 40px; background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-2);
}
.topbar__home {
  display: inline-flex; align-items: center; gap: 10px; font-weight: 700;
  font-size: 20px; color: var(--slate-2); flex-shrink: 0;
}
.topbar__home svg { width: 24px; height: 24px; }
.topbar__home:hover { color: var(--green-600); }
.topbar__title { font-weight: 700; font-size: 26px; color: var(--ink); }
.topbar__crumb { color: var(--muted); font-weight: 600; }
.lang-toggle {
  margin-left: auto; display: flex; align-items: center; border: 1px solid var(--line-3);
  border-radius: 999px; padding: 3px; gap: 2px;
}
.lang-toggle__btn {
  border: none; background: none; cursor: pointer; font-family: var(--font);
  font-weight: 700; font-size: 14px; color: var(--muted); padding: 6px 14px; border-radius: 999px;
  transition: background 0.2s, color 0.2s;
}
.lang-toggle__btn.is-active { background: var(--ink); color: #fff; }
.lang-toggle + .topbar__dots { margin-left: 20px; }
.topbar__dots { margin-left: auto; display: flex; gap: 10px; }
.topbar__dot {
  width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--line-3); transition: background 0.2s, transform 0.2s;
}
.topbar__dot.is-active { background: var(--green-600); transform: scale(1.2); }
.topbar__dot:hover { background: var(--green-300); }

/* ============================================================
   Escenario de diapositivas (galería horizontal, sin scroll)
   ============================================================ */
.stage {
  position: fixed; inset: 0; top: 84px;
}
.slide {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: none; flex-direction: column; align-items: center; justify-content: safe center;
  padding: 40px 90px;
  overflow-y: auto; /* red de seguridad: si el contenido no cabe en pantallas pequeñas, hace scroll local en vez de desaparecer */
  animation: slideIn 0.3s ease both;
}
.slide.is-active { display: flex; }
@keyframes slideIn { from { opacity: 0; } to { opacity: 1; } }

.arrow-nav {
  position: fixed; top: calc(84px + (100vh - 84px) / 2); transform: translateY(-50%);
  z-index: 50; width: 68px; height: 68px; border-radius: 50%; border: none;
  background: #fff; box-shadow: 0 10px 30px -8px rgba(11, 17, 32, 0.28);
  color: var(--slate-2); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s, color 0.2s, transform 0.2s;
}
.arrow-nav svg { width: 30px; height: 30px; }
.arrow-nav:hover { background: var(--green-tint); color: var(--green-600); transform: translateY(-50%) scale(1.06); }
.arrow-nav:disabled { opacity: 0; pointer-events: none; }
.arrow-nav--prev { left: 28px; }
.arrow-nav--next { right: 28px; }

.eyebrow {
  display: inline-block; margin-bottom: 14px; font-size: 19px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--green-600);
}
.slide__title {
  font-size: clamp(38px, 4.6vw, 58px); font-weight: 700; text-align: center;
  max-width: 1100px; line-height: 1.15; color: var(--ink);
}
.slide__title--emphasis { text-transform: uppercase; text-decoration: underline; text-underline-offset: 5px; }
.slide__lead {
  font-size: 27px; color: var(--slate); text-align: center; max-width: 900px;
  margin-top: 20px; line-height: 1.45;
}
.slide__body { margin-top: 44px; width: 100%; max-width: 1400px; }

/* ============================================================
   Componentes reutilizables de contenido
   ============================================================ */
.card-grid { display: grid; gap: 32px; width: 100%; }
.card-grid--3 { grid-template-columns: repeat(3, 1fr); }
.card-grid--4 { grid-template-columns: repeat(4, 1fr); }

.solution-card {
  background: linear-gradient(180deg, #FBFCFE, #fff); border: 1px solid var(--line-2);
  border-radius: var(--radius); padding: 40px 34px; text-align: left;
  box-shadow: 0 20px 50px -30px rgba(11, 17, 32, 0.25);
}
.solution-card__icon {
  width: 64px; height: 64px; border-radius: 18px; background: var(--grad);
  color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 22px;
}
.solution-card__icon svg { width: 32px; height: 32px; }
.solution-card__title { font-size: 27px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.solution-card__desc { font-size: 20px; color: var(--slate); margin-top: 14px; line-height: 1.45; }

.metric-tile {
  text-align: center; padding: 42px 26px; border: 1px solid var(--line-2);
  border-radius: var(--radius); background: linear-gradient(180deg, #FBFCFE, #fff);
}
.metric-tile__num {
  font-weight: 700; font-size: 56px; line-height: 1;
  background: linear-gradient(120deg, var(--green-600), var(--green-300));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.metric-tile__title { font-weight: 700; font-size: 22px; margin-top: 16px; color: var(--ink); }
.metric-tile__desc { font-size: 18px; color: var(--muted); margin-top: 6px; }

.metric-tile--compare { padding-top: 30px; }
.metric-tile__today { font-size: 18px; font-weight: 600; color: var(--muted); }
.metric-tile__growth {
  display: inline-flex; align-items: center; gap: 6px; margin: 10px 0;
  background: var(--grad); color: #fff; font-weight: 700; font-size: 18px;
  padding: 6px 16px; border-radius: 999px;
}
.metric-tile__growth svg { width: 16px; height: 16px; }

.assumption-chips {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px;
}
.assumption-chips--vertical { flex-direction: column; align-items: center; }
.assumption-chip {
  font-size: 17px; font-weight: 700; color: var(--ink); background: var(--green-tint);
  border: 1px solid var(--green-150); padding: 9px 18px; border-radius: 999px;
}
.note-banner {
  margin-top: 20px; text-align: center; font-size: 22px; font-weight: 600;
  color: var(--slate-3); background: var(--bg-alt); border: 1px solid var(--line);
  border-radius: 16px; padding: 20px 30px; max-width: 1100px;
}

.logo-groups { display: grid; grid-template-columns: 1fr; gap: 14px; width: 100%; }
.logo-group {
  border: 1px solid var(--line-2); border-radius: var(--radius); padding: 16px 24px;
  background: linear-gradient(180deg, #FBFCFE, #fff);
}
.logo-group__title {
  font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--green-600); margin-bottom: 12px;
}
.logo-row { display: flex; gap: 10px; flex-wrap: wrap; }
.logo-chip {
  font-weight: 700; font-size: 17px; color: var(--slate-3); background: var(--bg-alt);
  border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px;
}
.logo-img-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 26px; align-items: center; justify-items: center;
}
.logo-img { height: 54px; width: auto; max-width: 100%; object-fit: contain; }

.coming-soon {
  text-align: center; color: var(--muted); font-size: 22px; margin-top: 30px;
}

@media (max-width: 1100px) {
  .card-grid--3, .card-grid--4, .logo-groups { grid-template-columns: 1fr; }
}

/* Controlador genérico de "galería" de diapositivas: sin scroll vertical,
   navegación con flechas, puntos de progreso y teclado (← → Esc). */
(function () {
  'use strict';

  function Gallery(root) {
    this.root = root;
    this.stage = root.querySelector('[data-stage]');
    this.slides = Array.prototype.slice.call(root.querySelectorAll('.slide'));
    this.prevBtn = root.querySelector('[data-nav="prev"]');
    this.nextBtn = root.querySelector('[data-nav="next"]');
    this.dots = Array.prototype.slice.call(root.querySelectorAll('[data-dot]'));
    this.index = 0;
    this.bind();
    this.render();
  }

  Gallery.prototype.bind = function () {
    var self = this;
    if (this.prevBtn) this.prevBtn.addEventListener('click', function () { self.go(self.index - 1); });
    if (this.nextBtn) this.nextBtn.addEventListener('click', function () { self.go(self.index + 1); });
    this.dots.forEach(function (dot, i) {
      dot.addEventListener('click', function () { self.go(i); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') self.go(self.index + 1);
      else if (e.key === 'ArrowLeft') self.go(self.index - 1);
      else if (e.key === 'Escape') {
        if (document.querySelector('.journey-overlay.is-open')) return; // deja que el modal se cierre primero
        var home = document.querySelector('[data-home-link]');
        if (home) window.location.href = home.href;
      }
    });
  };

  Gallery.prototype.go = function (i) {
    if (i < 0 || i >= this.slides.length) return;
    this.index = i;
    this.render();
  };

  Gallery.prototype.render = function () {
    var self = this;
    this.slides.forEach(function (slide, i) { slide.classList.toggle('is-active', i === self.index); });
    if (this.prevBtn) this.prevBtn.disabled = this.index === 0;
    if (this.nextBtn) this.nextBtn.disabled = this.index === this.slides.length - 1;
    this.dots.forEach(function (dot, i) {
      dot.classList.toggle('is-active', i === self.index);
    });
  };

  function init() {
    var root = document.querySelector('[data-gallery]');
    if (root) new Gallery(root);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

/* Selector de idioma ES/EN, reutilizable en todas las páginas.
   Cada página define window.I18N = { es: {clave: texto}, en: {...} }
   antes de cargar este script, y marca el HTML con:
     data-i18n="clave"        -> sustituye textContent
     data-i18n-html="clave"   -> sustituye innerHTML (permite <strong> etc.)
     data-i18n-attr="alt:clave|title:otraClave" -> sustituye atributos
   Al cambiar de idioma se dispara el evento "belender:langchange" en
   document, con detail = lang, para que scripts de la página (mapa,
   modal del móvil...) puedan re-renderizar su contenido dinámico. */
(function () {
  'use strict';
  var KEY = 'belender_lang';

  function getLang() {
    try { return localStorage.getItem(KEY) || 'es'; } catch (e) { return 'es'; }
  }

  function storeLang(lang) {
    try { localStorage.setItem(KEY, lang); } catch (e) { /* ignorar */ }
  }

  function t(lang, key) {
    var dict = window.I18N && window.I18N[lang];
    if (dict && key in dict) return dict[key];
    var common = window.I18N_COMMON && window.I18N_COMMON[lang];
    if (common && key in common) return common[key];
    return null;
  }


  function applyCopy(root, lang) {
    var dict = window.I18N_COPY && window.I18N_COPY[lang];
    if (!dict || !root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var node;
    while ((node = walker.nextNode())) {
      var parent = node.parentElement;
      if (!parent || parent.closest('[data-i18n], [data-i18n-html], script, style')) continue;
      var raw = node.nodeValue, trimmed = raw.trim();
      if (trimmed && Object.prototype.hasOwnProperty.call(dict, trimmed)) {
        var start = raw.indexOf(trimmed);
        node.nodeValue = raw.slice(0, start) + dict[trimmed] + raw.slice(start + trimmed.length);
      }
    }
    root.querySelectorAll('*').forEach(function (el) {
      ['aria-label', 'title', 'placeholder'].forEach(function (attr) {
        var value = el.getAttribute(attr);
        if (value && Object.prototype.hasOwnProperty.call(dict, value)) el.setAttribute(attr, dict[value]);
      });
    });
  }

  function applyLang(lang) {
    document.documentElement.setAttribute('lang', lang);

    var pageTitle = document.querySelector('title');
    var titleDict = window.I18N_COPY && window.I18N_COPY[lang];
    if (pageTitle && titleDict && Object.prototype.hasOwnProperty.call(titleDict, pageTitle.textContent)) pageTitle.textContent = titleDict[pageTitle.textContent];

    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var val = t(lang, el.getAttribute('data-i18n'));
      if (val !== null) el.textContent = val;
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) {

    });

        var parts = pair.split(':');
        var attr = parts[0], key = parts[1];
        var val = t(lang, key);
        if (val !== null) el.setAttribute(attr, val);
      });
    });

    document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
      btn.classList.toggle('is-active', btn.getAttribute('data-lang-btn') === lang);
    });

    document.dispatchEvent(new CustomEvent('belender:langchange', { detail: lang }));
    applyCopy(document.body, lang);
  }

  function setLang(lang) {
    storeLang(lang);
    applyLang(lang);
  }

  function initToggle() {
    document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
      btn.addEventListener('click', function () { setLang(btn.getAttribute('data-lang-btn')); });
    });
  }

  window.BelenderI18n = { getLang: getLang, setLang: setLang, t: function (key) { return t(getLang(), key); }, applyCopy: function (root) { applyCopy(root || document.body, getLang()); } };

  function init() {
    initToggle();
    applyLang(getLang());
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
