<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f4">
  <title>Financiación · Demo interactiva Belender</title>
  <style>
    :root{--ink:#0b1120;--ink2:#202a19;--slate:#536078;--muted:#8791a5;--green:#5e8f4a;--green2:#86ae6b;--tint:#eef4e7;--line:#e7ebf0;--soft:#f7f9f6;--white:#fff;--font:Tahoma,Verdana,"Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:#f7f9f6}button,input{font:inherit}button{cursor:pointer}svg{display:block}
    .topbar{height:74px;display:flex;align-items:center;gap:15px;padding:0 clamp(20px,4vw,64px);background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),#9bc77b);color:white;font-size:17px}
    .topbar-sep{height:24px;width:1px;background:var(--line)}.topbar-label{color:var(--slate);font-size:14px;font-weight:700}.reset{margin-left:auto;border:1px solid #dce4d7;border-radius:999px;background:#fff;color:var(--ink2);font-weight:700;font-size:13px;padding:9px 14px}.reset:hover{background:var(--tint);border-color:var(--green2)}
    main{width:min(1540px,100%);min-height:calc(100vh - 74px);margin:0 auto;padding:24px clamp(20px,4vw,64px) 24px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:14px}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:24px}.eyebrow{margin:0 0 6px;color:var(--green);font-size:12px;letter-spacing:.13em;font-weight:800;text-transform:uppercase}.intro h1{margin:0;font-size:clamp(28px,3vw,42px);line-height:1.08;letter-spacing:-.045em}.route-badge{flex:none;border:1px solid #dce7d5;border-radius:999px;background:var(--tint);color:#426c34;padding:9px 14px;font-size:13px;font-weight:800}
    .progress{display:grid;grid-template-columns:repeat(var(--segments,11),1fr);gap:6px}.progress span{height:6px;border-radius:999px;background:#e2e7de;transition:background .2s}.progress span.is-done,.progress span.is-current{background:var(--green)}
    .layout{min-height:0;display:grid;grid-template-columns:minmax(285px,370px) minmax(0,1fr);gap:clamp(26px,6vw,92px);align-items:center}
    .system-visual[hidden]{display:none}
    .phone-wrap{display:flex;justify-content:center;align-items:center;min-height:0}.phone-wrap[hidden]{display:none!important}.phone{position:relative;width:min(100%,332px);height:min(54vh,590px);min-height:430px;padding:9px;border-radius:42px;background:#111827;box-shadow:0 26px 58px -28px rgba(12,19,34,.48)}
    .phone-notch{position:absolute;z-index:2;top:9px;left:50%;width:100px;height:19px;transform:translateX(-50%);border-radius:0 0 14px 14px;background:#111827}
    .phone-screen{height:100%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#d7dfd1 transparent;border-radius:33px;background:#fff;padding:42px 19px 18px;display:flex;flex-direction:column}
    .phone-status{height:12px;margin:-23px 0 16px;display:flex;justify-content:space-between;align-items:center;color:#758097;font-size:9px;font-weight:700}.status-dots{display:flex;gap:3px}.status-dots i{width:4px;height:4px;border-radius:50%;background:var(--green)}
    .screen-kicker{margin:0 0 5px;color:var(--green);font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.screen-title{margin:0 0 5px;font-size:22px;line-height:1.12;letter-spacing:-.035em}.screen-subtitle{margin:0 0 14px;color:var(--slate);font-size:12px;line-height:1.42}
    .phone-primary{width:100%;min-height:40px;margin-top:auto;border:0;border-radius:11px;background:var(--green);color:#fff;font-size:13px;font-weight:800}.phone-primary:hover,.phone-primary:focus-visible{background:#4f7c3e}.phone-primary:disabled{opacity:.42;cursor:not-allowed}
    .loan-amount{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:6px 0 14px}.amount-box{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fbfcfa}.amount-box small,.field small{display:block;margin-bottom:4px;color:var(--slate);font-size:10px}.amount-box strong{font-size:17px;color:var(--ink2)}
    .phone-stack{display:grid;gap:9px;margin:3px 0 14px}.choice-card{width:100%;display:flex;align-items:center;gap:11px;padding:11px 10px;border:1px solid #e3e9df;border-radius:13px;background:#fff;color:var(--ink2);text-align:left;transition:border-color .16s,background .16s,transform .16s}.choice-card:hover,.choice-card:focus-visible{border-color:var(--green2);background:#f7faf4;transform:translateY(-1px)}
    .choice-icon{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--tint);color:var(--green)}.choice-icon svg{width:21px;height:21px}.choice-copy{min-width:0}.choice-copy strong{display:block;font-size:12px;line-height:1.25}.choice-copy span{display:block;margin-top:3px;color:var(--slate);font-size:10px;line-height:1.25}.choice-arrow{margin-left:auto;color:#91a086;font-size:18px}
    .field{display:block;margin:0 0 9px}.field input{width:100%;height:40px;padding:0 11px;border:1px solid #dfe5dc;border-radius:10px;background:#fbfcfa;color:var(--ink2);outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #5e8f4a20}.field input::placeholder{color:#a1a9b7}
    .legal-list{display:grid;gap:10px;margin:5px 0 13px}.legal-row{display:flex;align-items:flex-start;gap:8px;color:var(--ink2);font-size:10.5px;line-height:1.36}.legal-row input{flex:none;width:15px;height:15px;margin:1px 0 0;accent-color:var(--green)}
    .access-methods{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:5px 0 13px}.access-button{min-height:76px;border:1px solid #e3e9df;border-radius:12px;background:#fff;color:var(--ink2);font-size:11px;font-weight:800}.access-button:hover{border-color:var(--green);background:var(--tint)}.access-button span{display:block;margin:0 auto 5px;color:var(--green);font-size:22px}
    .qr-wrap{display:grid;justify-items:center;gap:10px;margin:3px 0 12px}.qr-grid{width:150px;height:150px;display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr);padding:8px;border:1px solid #e5e9e3;border-radius:11px;background:#fff}.qr-cell{background:transparent}.qr-cell.on{background:#172018}.qr-caption{font-size:9px;color:var(--muted)}.push-link{margin-top:9px;border:0;background:transparent;color:var(--green);font-size:11px;font-weight:800;text-decoration:underline;text-underline-offset:3px}
    .demo-note{margin:3px 0 10px;padding:8px 10px;border-radius:9px;background:#f5f7fa;color:var(--slate);font-size:9px;line-height:1.35}
    .data-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:4px 0 12px}.data-field{min-height:46px;padding:7px 8px;border:1px solid #e2e7df;border-radius:9px;background:#fbfcfa}.data-field small{display:block;color:var(--slate);font-size:9px}.data-field strong{display:block;margin-top:3px;color:var(--ink2);font-size:10.5px;line-height:1.15}.data-fields-empty .data-field strong{color:#b4bcc7;font-weight:500}
    .doc-list{display:grid;gap:7px;margin:3px 0 12px}.doc-row{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid #e7eae4;border-radius:9px;color:var(--ink2);font-size:10.5px;font-weight:700}.doc-icon{width:17px;height:19px;border:1.5px solid var(--green);border-radius:3px;position:relative}.doc-icon:after{content:"";position:absolute;left:3px;right:3px;top:6px;height:1px;background:var(--green);box-shadow:0 4px 0 var(--green)}.doc-ok{margin-left:auto;color:var(--green);font-size:13px}.doc-upload{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .success-state{flex:1;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.success-icon{width:72px;height:72px;display:grid;place-items:center;margin-bottom:14px;border-radius:50%;background:var(--tint);color:var(--green);font-size:39px;font-weight:700}.success-state .screen-subtitle{max-width:225px}
    .contract-card{display:grid;place-items:center;min-height:175px;margin:5px 0 14px;border:1px solid #e4e9e0;border-radius:14px;background:linear-gradient(#fff,#f7f9f5);color:var(--green)}.contract-card svg{width:70px;height:82px}
    .video-box{position:relative;display:grid;place-items:center;flex:1;min-height:230px;margin:5px 0 12px;overflow:hidden;border-radius:14px;background:#111827}.video-box video{width:100%;height:100%;max-height:300px;object-fit:cover}.video-label{position:absolute;top:9px;left:9px;padding:5px 7px;border-radius:999px;background:#111827c9;color:#fff;font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .right{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:16px}.right[hidden]{display:none!important}.context-card{min-height:315px;padding:clamp(25px,3.4vw,50px);border:1px solid var(--line);border-radius:25px;background:linear-gradient(180deg,#fff,#fcfdfb);box-shadow:0 24px 48px -38px rgba(11,17,32,.32);display:flex;flex-direction:column;justify-content:center}.context-card__eyebrow{margin:0 0 9px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.context-card h2{margin:0 0 10px;font-size:clamp(25px,2.65vw,38px);line-height:1.1;letter-spacing:-.04em}.context-card__text{margin:0;color:#35415a;font-size:clamp(16px,1.5vw,21px);line-height:1.48}.context-card__detail{margin:16px 0 0;padding:14px 16px;border-radius:13px;background:#f5f7fa;color:#414d65;font-size:14px;line-height:1.45}.context-card__detail strong{color:var(--ink2)}.context-card__list{display:grid;gap:10px;margin:16px 0 0;padding:0;list-style:none}.context-card__list li{display:flex;gap:10px;color:#414d65;font-size:14px;line-height:1.4}.context-card__list li:before{content:"✓";flex:none;color:var(--green);font-weight:900}.tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:21px}.tag{display:inline-flex;align-items:center;min-height:38px;padding:8px 13px;border:1px solid var(--green2);border-radius:11px;background:var(--tint);color:var(--ink2);font-size:14px;font-weight:800}.aside-icon{width:48px;height:48px;display:grid;place-items:center;margin-bottom:18px;border-radius:14px;background:var(--tint);color:var(--green)}.aside-icon svg{width:26px;height:26px}
    .system-visual{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:clamp(12px,2vw,26px);margin:4px 0 20px}.system-node{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:18px;border:1px solid var(--green2);border-radius:20px;background:var(--tint);color:var(--ink2);text-align:center}.system-node svg{width:52px;height:52px;color:var(--green)}.system-node strong{font-size:clamp(18px,2.1vw,27px)}.system-node span{color:var(--slate);font-size:13px}.system-connector{height:4px;position:relative;border-radius:9px;background:#dce3d7}.system-connector:after{content:"";position:absolute;right:-1px;top:-7px;border:9px solid transparent;border-left-color:var(--green);border-right:0}.system-packet{position:absolute;top:-7px;left:0;width:18px;height:18px;border:3px solid white;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--green2);animation:packet 2.5s ease-in-out infinite alternate}@keyframes packet{to{left:calc(100% - 18px)}}
    .layout.is-system{align-items:stretch;min-height:clamp(390px,48vh,460px)}.layout.is-system .system-visual{grid-column:1;grid-row:1;grid-template-columns:1fr;align-content:center;gap:9px;height:100%;min-height:0;margin:0;padding:14px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#fbfcfe,#fff)}.layout.is-system .system-node{min-height:105px;gap:5px;padding:10px}.layout.is-system .system-node svg{width:38px;height:38px}.layout.is-system .system-node strong{font-size:clamp(18px,1.8vw,24px)}.layout.is-system .system-node span{font-size:13px}.layout.is-system .system-connector{width:4px;height:30px;justify-self:center}.layout.is-system .system-connector:after{top:auto;bottom:0;right:-6px;border:8px solid transparent;border-top-color:var(--green);border-bottom:0}.layout.is-system .system-packet{left:calc(50% - 9px);top:0;animation:packetVertical 2.5s ease-in-out infinite alternate}@keyframes packetVertical{to{top:calc(100% - 18px)}}
    .controls{display:grid;grid-template-columns:minmax(285px,370px) minmax(0,1fr);gap:clamp(26px,6vw,92px);align-items:center}.flow-hint{color:var(--muted);font-size:12px;font-weight:700}.buttons{display:flex;justify-content:flex-end;gap:10px}.nav-button{min-width:112px;min-height:44px;border:1px solid #dbe5d4;border-radius:12px;background:white;color:var(--ink2);font-weight:800}.nav-button--next{border-color:var(--green);background:var(--green);color:#fff}.nav-button:hover:not(:disabled){filter:brightness(.97);transform:translateY(-1px)}.nav-button:disabled{opacity:.45;cursor:not-allowed}
    .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-height:850px) and (min-width:861px){main{padding-top:16px;gap:10px}.intro h1{font-size:34px}.phone{height:min(54vh,520px);min-height:400px}.context-card{min-height:285px;padding:30px}.screen-title{font-size:20px}}
    @media(max-width:900px){main{min-height:calc(100vh - 68px)}.topbar{height:68px}.layout{grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:22px}.phone{width:100%;height:620px;min-height:0}.controls{grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:22px}.context-card{padding:26px}.context-card__text{font-size:16px}.system-visual{grid-template-columns:1fr 55px 1fr;gap:10px}.system-node{min-height:150px;padding:12px}}
    @media(max-width:680px){.topbar{padding:0 16px}.topbar-label,.topbar-sep{display:none}.reset{font-size:11px;padding:8px 10px}main{padding:19px 16px 24px;gap:13px}.intro{align-items:flex-start;flex-direction:column;gap:9px}.intro h1{font-size:29px}.route-badge{padding:7px 11px}.layout{grid-template-columns:1fr;gap:18px}.phone-wrap{order:1}.right{order:2}.phone{width:min(100%,330px);height:630px}.context-card{min-height:unset;padding:23px;border-radius:19px}.context-card h2{font-size:26px}.context-card__text{font-size:16px}.context-card__detail{font-size:13px}.context-card__list li{font-size:13px}.controls{grid-template-columns:1fr;gap:10px}.flow-hint{order:2;text-align:center}.buttons{order:1}.nav-button{flex:1}.system-visual{grid-template-columns:1fr;gap:9px}.system-node{min-height:110px}.system-node svg{width:38px;height:38px}.system-connector{width:4px;height:38px;justify-self:center}.system-connector:after{top:auto;right:-7px;bottom:-1px;border:9px solid transparent;border-top-color:var(--green);border-bottom:0}.system-packet{left:-7px;top:0;animation:packetDown 2.5s ease-in-out infinite alternate}@keyframes packetDown{to{top:calc(100% - 18px)}}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>Belender</span></div>
    <span class="topbar-sep" aria-hidden="true"></span><span class="topbar-label">Demo interactiva · Financiación</span>
    <button class="reset" type="button" id="reset">Reiniciar recorrido</button>
  </header>
  <main>
    <section class="intro" aria-label="Título del recorrido">
      <div><p class="eyebrow">CASO DE USO · FLUJO ALTERNATIVO</p><h1>De la solicitud a una relación continua</h1></div>
      <span class="route-badge" id="route-badge">Solicitud</span>
    </section>
    <div class="progress" id="progress" role="progressbar" aria-label="Avance del recorrido"></div>
    <section class="layout" id="layout" aria-live="polite">
      <div class="phone-wrap" id="phone-wrap"><div class="phone" aria-label="Vista simulada de móvil"><div class="phone-notch"></div><div class="phone-screen" id="phone-screen"></div></div></div>
      <div class="system-visual" id="system-visual" hidden aria-label="Comunicación entre sistemas"><div class="system-node"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="8" width="34" height="32" rx="5"/><path d="M14 17h20M14 24h14M14 31h10"/></svg><strong>Belender</strong><span>Banco de identidades</span></div><div class="system-connector" aria-hidden="true"><span class="system-packet"></span></div><div class="system-node"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18 24 7l19 11M8 20h32M10 20v18m9-18v18m10-18v18m9-18v18M5 40h38"/></svg><strong>Banco</strong><span>Recibe una alerta autorizada</span></div></div>
      <aside class="right" id="right-panel"></aside>
    </section>
    <footer class="controls">
      <div class="flow-hint" id="flow-hint">Selecciona una ruta y avanza por la experiencia.</div>
      <div class="buttons"><button class="nav-button" type="button" id="prev">Anterior</button><button class="nav-button nav-button--next" type="button" id="next">Continuar</button></div>
    </footer>
  </main>
  <script>
  (()=>{
    const icons={
      wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18M16 14h.01M6 5V3h12v2"/></svg>',
      form:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/><path d="M3 7v14"/></svg>',
      person:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
      bank:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18 24 7l19 11M8 20h32M10 20v18m9-18v18m10-18v18m9-18v18M5 40h38"/></svg>',
      belender:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="8" width="34" height="32" rx="5"/><path d="M14 17h20M14 24h14M14 31h10"/></svg>'
    };
    const fakeFields=[['Nombre','Lucía'],['Apellidos','Martín'],['Estado civil','Soltera'],['Profesión','Analista'],['Dirección','Madrid'],['Hijos','0'],['Ingresos','34.800 €']];
    const dataGrid=(filled=true)=>'<div class="data-grid '+(filled?'':'data-fields-empty')+'">'+fakeFields.map(([k,v])=>'<div class="data-field"><small>'+k+'</small><strong>'+(filled?v:'—')+'</strong></div>').join('')+'</div>';
    const consentHtml='<div class="legal-list"><label class="legal-row"><input type="checkbox" data-legal><span>Consiento el acceso a mis datos en las Administraciones Públicas.</span></label><label class="legal-row"><input type="checkbox" data-legal><span>Consiento crear una identidad digital para actualizar mis datos periódicamente.</span></label><label class="legal-row"><input type="checkbox" data-legal><span>Consiento enviar los datos al financiador.</span></label></div>';
    const docsHtml=(upload=false)=>'<div class="doc-list">'+['Renta','Ingresos','Historial laboral','Deudas'].map(x=>'<div class="doc-row"><span class="doc-icon" aria-hidden="true"></span>'+x+(upload?'<span class="doc-ok" aria-label="Subir documento"><svg class="doc-upload" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 14v5h14v-5"/></svg></span>':'<span class="doc-ok">✓</span>')+'</div>').join('')+'</div>';
    const successHtml=(title,sub,icon='✓')=>'<div class="success-state"><div class="success-icon">'+icon+'</div><h2 class="screen-title">'+title+'</h2><p class="screen-subtitle">'+sub+'</p><button class="phone-primary" data-next-screen>Continuar</button></div>';
    const qrHtml=()=>{let s='<div class="qr-grid" role="img" aria-label="Código QR ilustrativo">';for(let y=0;y<21;y++)for(let x=0;x<21;x++){let finder=(ox,oy)=>x>=ox&&x<ox+7&&y>=oy&&y<oy+7?((x===ox||x===ox+6||y===oy||y===oy+6)||(x>=ox+2&&x<=ox+4&&y>=oy+2&&y<=oy+4)):null;let a=finder(0,0),b=finder(14,0),c=finder(0,14);let on=a!==null?a:b!==null?b:c!==null?c:((x*7+y*11+x*y*3)%9<4);s+='<i class="qr-cell'+(on?' on':'')+'"></i>'}return s+'</div>'};
    const stages={
      start:{label:'Solicitud inicial',route:'Solicitud',aside:{title:'Financiación digital',text:'El cliente comienza su solicitud y elige cómo completar el proceso.'},screen:'<h2 class="screen-title">Solicita tu préstamo</h2><p class="screen-subtitle">Elige el importe y el plazo de financiación.</p><div class="loan-amount"><div class="amount-box"><small>Importe</small><strong>10.000 €</strong></div><div class="amount-box"><small>Plazo</small><strong>48 meses</strong></div></div><button class="phone-primary" data-next-screen>Solicitar préstamo</button>'},

      documents:{label:'Documentación',route:'Datos para la operación',aside:{eyebrow:'DOCUMENTACIÓN',title:'Entregamos los documentos necesarios',text:'Ponemos a disposición del financiador la documentación necesaria para analizar la solicitud.',tags:['Opendata']},screen:'<h2 class="screen-title">Documentación</h2><p class="screen-subtitle">Documentos disponibles para tu solicitud.</p>'+docsHtml()+'<div class="demo-note">El acceso y el envío se realizan con las autorizaciones del cliente.</div><button class="phone-primary" data-next-screen>Continuar</button>'},

    const paths={wallet:['start','choose','walletConsent','walletQr','walletLegal','walletQr','walletFilled','documents','approved','signature','identity','alerts'],auto:['start','choose','autoDni','autoOtp','autoFilled','documents','approved','videoId','signature','identity','alerts'],manual:['start','choose','manualForm','manualDocuments','approved','videoId','signature','identity','alerts']};
    const screen=document.getElementById('phone-screen'),right=document.getElementById('right-panel'),progress=document.getElementById('progress'),prev=document.getElementById('prev'),next=document.getElementById('next'),badge=document.getElementById('route-badge'),hint=document.getElementById('flow-hint'),phoneWrap=document.getElementById('phone-wrap'),systemVisual=document.getElementById('system-visual'),layout=document.getElementById('layout');
    let route=null,path=['start','choose'],index=0;
    function makeAside(item){const a=item.aside;const icon=item.system?icons.bank:(item.label==='Firma'?icons.form:item.label==='Videoidentificación'?icons.person:icons.wallet);return '<article class="context-card"><div class="aside-icon">'+icon+'</div><p class="context-card__eyebrow">'+a.eyebrow+'</p><h2>'+a.title+'</h2><p class="context-card__text">'+a.text+'</p>'+(a.detail?'<div class="context-card__detail">'+a.detail+'</div>':'')+(a.list?'<ul class="context-card__list">'+a.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')+(a.tags?'<div class="tags">'+a.tags.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div>':'')+'</article>'}
    function progressMarkup(){progress.style.setProperty('--segments',path.length);progress.innerHTML=path.map((_,i)=>'<span class="'+(i<index?'is-done':i===index?'is-current':'')+'"></span>').join('');progress.setAttribute('aria-valuenow',String(index+1));progress.setAttribute('aria-valuemin','1');progress.setAttribute('aria-valuemax',String(path.length))}
    function render(){const key=path[index],item=stages[key];progressMarkup();badge.textContent=item.route;layout.classList.toggle('is-system',!!item.system);layout.classList.toggle('is-manual',route==='manual'&&key==='approved');phoneWrap.hidden=!!item.system;systemVisual.hidden=!item.system;right.hidden=route==='manual'&&key==='approved';right.innerHTML=makeAside(item);screen.innerHTML=item.system?'':('<div class="phone-status" aria-hidden="true"><span>09:41</span><span class="status-dots"><i></i><i></i><i></i></span></div>'+item.screen);prev.disabled=index===0;const atChoice=key==='choose';next.disabled=atChoice;next.textContent=index===path.length-1?'Finalizar':'Continuar';hint.textContent=atChoice?'Selecciona una de las tres opciones en la pantalla.':(item.system?'Comunicación segura entre sistemas.':'');if(key==='walletConsent'){const chk=screen.querySelector('[data-single-consent]'),btn=screen.querySelector('[data-next-screen]');chk.addEventListener('change',()=>btn.disabled=!chk.checked)}if(key==='walletLegal'){const checks=[...screen.querySelectorAll('[data-legal]')],btn=screen.querySelector('[data-next-screen]');const update=()=>btn.disabled=!checks.every(x=>x.checked);checks.forEach(x=>x.addEventListener('change',update));update()}screen.querySelectorAll('[data-next-screen]').forEach(el=>el.addEventListener('click',advance));screen.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',()=>{route=el.dataset.route;path=paths[route].slice();index=2;render()}));}
    function advance(){if(index<path.length-1){index++;render()}else{route=null;path=['start','choose'];index=0;render()}}
    prev.addEventListener('click',()=>{if(index>0){index--;render()}});next.addEventListener('click',advance);document.getElementById('reset').addEventListener('click',()=>{route=null;path=['start','choose'];index=0;render()});
    document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,button')&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;if(e.key==='ArrowLeft'&&!prev.disabled)prev.click();if(e.key==='ArrowRight'&&!next.disabled)next.click()});render();
  })();
